name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      region:
        description: 'Google Cloud region'
        required: false
        default: 'europe-west1'
        type: string

env:
  PROJECT_ID: 'exan-beta'
  REGION: ${{ github.event.inputs.region || 'europe-west1' }}
  REPO_NAME: 'exan-repo'

jobs:
  check-gcp-auth:
    name: Check GCP authentication
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Validate Workload Identity Federation configuration
        id: check
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
        run: |
          if [[ -n "$GCP_WIF_PROVIDER" && -n "$GCP_WIF_SERVICE_ACCOUNT" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "GCP WIF secrets are not configured; skipping deployment."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    name: Build, Push & Deploy to Cloud Run
    needs: check-gcp-auth
    if: ${{ needs.check-gcp-auth.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Supports Workload Identity Federation (recommended) or Service Account Key secret
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # =====================================================================
      # 1. AUTH SERVER
      # =====================================================================
      - name: Build and Push auth-server image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/auth-server"
          docker build -f Dockerfile.auth -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push --all-tags "${IMAGE}"

      - name: Deploy auth-server to Cloud Run
        run: |
          gcloud run deploy auth-server \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/auth-server:${{ github.sha }}" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 3001 \
            --memory 512Mi \
            --min-instances 0 \
            --cpu 1 \
            --set-env-vars PORT=3001 \
            --set-secrets JWT_SECRET=JWT_SECRET:latest,MONGO_URI=MONGO_URI:latest

      # =====================================================================
      # 2. INFERENCE SERVICE
      # =====================================================================
      - name: Build and Push inference image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/inference"
          docker build -f inference/Dockerfile -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" ./inference
          docker push --all-tags "${IMAGE}"

      - name: Deploy inference to Cloud Run
        run: |
          gcloud run deploy inference \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/inference:${{ github.sha }}" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --memory 512Mi \
            --cpu 2 \
            --timeout 120s \
            --min-instances 0 \
            --max-instances 1 \
            --set-secrets JWT_SECRET=JWT_SECRET:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest

      - name: Resolve Cloud Run backend URLs
        id: backend-urls
        run: |
          AUTH_SERVER_URL="$(gcloud run services describe auth-server \
            --region "${{ env.REGION }}" \
            --format='value(status.url)')"
          INFERENCE_SERVER_URL="$(gcloud run services describe inference \
            --region "${{ env.REGION }}" \
            --format='value(status.url)')"

          if [[ -z "$AUTH_SERVER_URL" || -z "$INFERENCE_SERVER_URL" ]]; then
            echo "Cloud Run backend URL lookup returned an empty value" >&2
            exit 1
          fi

          echo "auth_server_url=$AUTH_SERVER_URL" >> "$GITHUB_OUTPUT"
          echo "inference_server_url=$INFERENCE_SERVER_URL" >> "$GITHUB_OUTPUT"

      # =====================================================================
      # 3. WEBAPP
      # =====================================================================
      - name: Build and Push webapp image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/webapp"
          docker build -f webapp/Dockerfile -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" ./webapp
          docker push --all-tags "${IMAGE}"

      - name: Deploy webapp to Cloud Run
        run: |
          gcloud run deploy webapp \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/webapp:${{ github.sha }}" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 80 \
            --memory 512Mi \
            --min-instances 0 \
            --cpu 1 \
            --set-env-vars "AUTH_SERVER_URL=${{ steps.backend-urls.outputs.auth_server_url }},INFERENCE_SERVER_URL=${{ steps.backend-urls.outputs.inference_server_url }}"
