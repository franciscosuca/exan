[package]
name = "exan-desktop"
version = "1.0.0"
description = "Exan local desktop application"
authors = ["Exan"]
edition = "2021"

[lib]
name = "exan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
