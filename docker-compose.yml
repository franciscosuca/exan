services:
  mongodb:
    image: mongo:7
    container_name: exan-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
      - MONGO_INITDB_DATABASE=exan
    volumes:
      - mongodb_data:/data/db
      - ./db/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro 
    restart: unless-stopped

  inference:
    build: ./inference
    container_name: exan-inference
    ports:
      - "8000:8000"
    env_file:
      - path: ./inference/.env
        required: false
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LMSTUDIO_BASE_URL=http://host.docker.internal:1234/v1
    volumes:
      - ./inference/app:/app/app
      - ./logs:/logs
    restart: unless-stopped

  auth-server:
    build:
      context: .
      dockerfile: Dockerfile.auth
    container_name: exan-auth-server
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://exan_app:exan_app_password@mongodb:27017/exan?authSource=exan
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-random-secret}
    depends_on:
      - mongodb
    restart: unless-stopped

  webapp:
    build: ./webapp
    container_name: exan-webapp
    ports:
      - "3000:80"
    environment:
      - AUTH_SERVER_URL=http://auth-server:3001
      - INFERENCE_SERVER_URL=http://inference:8000
    depends_on:
      - inference
      - auth-server
    restart: unless-stopped

volumes:
  mongodb_data:
