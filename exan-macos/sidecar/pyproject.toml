[project]
name = "exan-sidecar"
version = "0.1.0"
description = "Local engine for Exan: reads exam photos with small on-device vision models and grades answers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2,<1",
    "uvicorn>=0.54.0,<1",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1,<1",
    "pydantic>=2.13.5,<3",
    "pillow>=12.3.0",
    "pypdfium2>=5.13.0,<6",
    "segno>=1.6.6,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
build = [
    "pyinstaller>=6.22.3",
]

[project.scripts]
exan-sidecar = "exan_sidecar.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["exan_sidecar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501"]
"exan_sidecar/phone_page.py" = ["E501"]
"exan_sidecar/engine/prompts.py" = ["E501"]
