# Builds and tests Exan for Windows (x64) and uploads the installers.
# GitHub only runs this once `exan-windows/` is the root of its own repository.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install UI dependencies
        run: npm ci

      - name: Set up the engine and build exan-sidecar.exe
        run: npm run setup
        env:
          EXAN_PYTHON: python

      - name: Type-check, lint and test (UI + engine)
        run: npm run check

      - name: Build installers (NSIS + MSI)
        run: npx tauri build

      - name: Rust lint and tests
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Smoke test the engine and the built-in model runtime
        shell: pwsh
        run: |
          & "src-tauri/target/release/exan-sidecar.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "src-tauri/target/release/exan-sidecar.exe" models list
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "src-tauri/target/release/runtime/llama-server.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: exan-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
