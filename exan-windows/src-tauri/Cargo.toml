[package]
name = "exan"
version = "0.1.0"
description = "Exan for Windows - local exam correction with small on-device vision models"
authors = ["Exan contributors"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name (cargo#8519 on Windows).
name = "exan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
getrandom = "0.3"
tokio = { version = "1", features = ["time"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
